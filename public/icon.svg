<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Anytime Help">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#5A8BF7"/>
      <stop offset="0.45" stop-color="#2E63E8"/>
      <stop offset="1" stop-color="#1039BE"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFD9C2"/>
      <stop offset="1" stop-color="#FFA582"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="118" ry="118"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="118" ry="118" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <!-- Cupped hands -->
    <g fill="url(#skin)">
      <g transform="translate(-16,26)">
        <rect x="52" y="196" width="56" height="250" rx="28" transform="rotate(-7 80 321)"/>
        <rect x="96" y="286" width="86" height="266" rx="43" transform="rotate(9 139 419)"/>
        <rect x="134" y="300" width="40" height="86" rx="20" transform="rotate(26 154 343)"/>
      </g>
      <g transform="translate(528,26) scale(-1,1)">
        <rect x="52" y="196" width="56" height="250" rx="28" transform="rotate(-7 80 321)"/>
        <rect x="96" y="286" width="86" height="266" rx="43" transform="rotate(9 139 419)"/>
        <rect x="134" y="300" width="40" height="86" rx="20" transform="rotate(26 154 343)"/>
      </g>
    </g>

    <!-- Heart -->
    <path
      d="M256 372C154 302 114 250 114 198c0-43 33-73 74-73 28 0 52 15 68 40 16-25 40-40 68-40 41 0 74 30 74 73 0 52-40 104-142 174z"
      fill="#FFFFFF" stroke="#22D3D8" stroke-width="22" stroke-linejoin="round"/>

    <!-- Question badge -->
    <path d="M356 172l-4 34 30-22z" fill="#F9C3C1"/>
    <rect x="336" y="72" width="126" height="98" rx="42" fill="#F9C3C1"/>
    <text x="399" y="140" text-anchor="middle" font-family="Outfit, Inter, ui-sans-serif, system-ui, sans-serif"
          font-size="72" font-weight="700" fill="#2A4FBF">?</text>
  </g>
</svg>
